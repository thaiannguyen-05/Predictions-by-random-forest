services:
  db:
    image: postgres:16-alpine
    container_name: predict-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: predict-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - public
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit-init:
    image: curlimages/curl:8.12.1
    container_name: predict-rabbitmq-init
    env_file:
      - .env
    depends_on:
      rabbit:
        condition: service_healthy
    networks:
      - public
    restart: "no"
    command:
      - sh
      - -c
      - >
        set -e;
        echo "Ensuring RabbitMQ vhost and permissions...";
        curl -fsS -u "$${RABBITMQ_USER}:$${RABBITMQ_PASS}" -H "content-type:application/json"
        -X PUT "http://rabbit:15672/api/vhosts/$${RABBITMQ_VHOST}";
        curl -fsS -u "$${RABBITMQ_USER}:$${RABBITMQ_PASS}" -H "content-type:application/json"
        -X PUT "http://rabbit:15672/api/permissions/$${RABBITMQ_VHOST}/$${RABBITMQ_USER}"
        -d '{"configure":".*","write":".*","read":".*"}';
        echo "RabbitMQ init completed.";

  redis:
    image: redis:7-alpine
    container_name: predict-redis
    env_file:
      - .env
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379" 
    networks:
      - public
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  public:
